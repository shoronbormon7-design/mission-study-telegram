name: Mission Study Telegram

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'Asia/Dhaka'
    - cron: '0 13 * * *'
      timezone: 'Asia/Dhaka'
    - cron: '0 14 * * *'
      timezone: 'Asia/Dhaka'
    - cron: '0 22 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Telethon
        run: pip install telethon

      - name: Run Telegram automation
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python telegram_send.py
