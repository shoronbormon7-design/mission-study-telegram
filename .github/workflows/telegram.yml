name: Mission Study Telegram

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'Asia/Dhaka'
    - cron: '0 13 * * *'
      timezone: 'Asia/Dhaka'
    - cron: '0 14 * * *'
      timezone: 'Asia/Dhaka'
    - cron: '0 22 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Telethon
        run: pip install telethon

      - name: Set post time
        run: |
          if [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "POST_TIME=05:00" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            echo "POST_TIME=13:00" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "POST_TIME=14:00" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "POST_TIME=22:00" >> $GITHUB_ENV
          fi

      - name: Run Telegram automation
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python .github/workflows/telegram_send.py
